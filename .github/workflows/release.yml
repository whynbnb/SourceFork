name: release

on:
  push:
    tags:
      - "sf*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip the sf prefix from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#sf}"
          if [[ -z "$version" ]]; then
            echo "cannot derive version from tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

  assets:
    name: Build release assets
    needs: prepare
    uses: ./.github/workflows/build-assets.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Show release assets
        run: ls -lh release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SourceFork ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
